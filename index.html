function setActiveBrand(brand){select.value=brand;var buttons=chips.querySelectorAll('[data-brand]');for(var i=0;i<buttons.length;i++){var active=buttons[i].getAttribute('data-brand')===brand;buttons[i].classList.toggle('active',active);buttons[i].setAttribute('aria-pressed',active?'true':'false')}}
function updateCounts(){var nodes=document.querySelectorAll('[data-brand-count]');for(var i=0;i<nodes.length;i++){var b=nodes[i].getAttribute('data-brand-count');var count=b==='all'?PRODUCTS.length:PRODUCTS.filter(function(p){return p.brand===b}).length;nodes[i].textContent=' '+count}}
function render(){var brand=select.value||'all',raw=search.value.trim(),query=normalize(raw);var rows=PRODUCTS.filter(function(p){if(brand!=='all'&&p.brand!==brand)return false;if(!query)return true;return normalize([p.brand,p.name,p.spec,p.code].join(' ')).indexOf(query)!==-1});clearBtn.classList.toggle('visible',raw.length>0);var scope=brand==='all'?'全部商品':brandLabel(brand);meta.innerHTML='<strong>'+esc(scope)+'</strong>'+(raw?' · 搜索“'+esc(raw)+'”':'')+' · '+rows.length+' 个规格';var out='';for(var i=0;i<rows.length;i++){var p=rows[i];out+='<article class="card"><div class="pic"><img loading="lazy" decoding="async" src="'+esc(p.image)+'" alt="'+esc(p.name)+'"></div><div class="content"><span class="badge">'+esc(brandLabel(p.brand))+'</span><div class="name">'+esc(p.name)+'</div><div class="spec">'+esc(p.spec)+'</div><div class="code">'+esc(p.code)+'</div><div class="prices"><div class="price"><span>代理价</span><strong>'+money(p.agent)+'</strong></div><div class="price retail"><span>最低零售价</span><strong>'+money(p.retail)+'</strong></div></div></div></article>'}grid.innerHTML=out||'<div class="empty"><strong>没有找到“'+esc(raw||scope)+'”</strong><span>请尝试产品名、型号、商家编码，或切换为全部品牌</span></div>'}
select.addEventListener('change',function(){setActiveBrand(this.value);render()});chips.addEventListener('click',function(e){var button=e.target.closest('[data-brand]');if(!button)return;setActiveBrand(button.getAttribute('data-brand'));render()});allBtn.addEventListener('click',function(){setActiveBrand('all');render()});search.addEventListener('input',render);search.addEventListener('keydown',function(e){if(e.key==='Escape'){search.value='';render()}});clearBtn.addEventListener('click',function(){search.value='';search.focus();render()});updateCounts();setActiveBrand('all');render();
</script></body></html>
